# Builds VooSquare for Android on every push to main (or by hand: Actions → Android → Run workflow).
# Outputs (Actions → the run → Artifacts):
#   voosquare-android-test-apk   app-debug.apk: install on any Android phone to test (allow "install unknown apps")
#   voosquare-android-release    app-release.aab for the Play Store (+ app-release.apk), signed when the upload key secrets are set
name: Android
on:
  push:
    branches: [main, mobile]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_VERSION: ${{ vars.APP_VERSION }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install --no-audit --no-fund 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Create the Android project
        run: |
          set -o pipefail
          npx cap add android 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          npx capacitor-assets generate --android 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          node scripts/prepare.js android 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          npx cap sync android 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Upload key (only when the secrets are set)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Release build will be signed with the upload key."
          else
            echo "No upload key secrets yet: the release build is unsigned; the test APK is still made."
          fi
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease assembleRelease 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          mkdir -p "$RUNNER_TEMP/out/test" "$RUNNER_TEMP/out/release"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/out/test/VooSquare-test.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/release/VooSquare.aab"
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/out/release/" || true
      - uses: actions/upload-artifact@v4
        with:
          name: voosquare-android-test-apk
          path: ${{ runner.temp }}/out/test/
      - uses: actions/upload-artifact@v4
        with:
          name: voosquare-android-release
          path: ${{ runner.temp }}/out/release/
      - name: Build report
        if: always()
        run: bash scripts/report.sh android "${{ job.status }}"
